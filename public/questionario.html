<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/questionario.js"></script>
</head>

<body>
    <header>
        <div class="menu-superior">
            <img id="img-logo-small" src="assets/img/tipberg_logo_small.png" alt="">
            <div class="botoes">
                <a class="botao-menu" href="#">Início</a>
                <a class="botao-menu" href="#">
                    <button class="botao-principal">Comunidade em Números</button>
                </a>
            </div>
        </div>
    </header>
    <main>
        <div class="formulario">
            <div class="form-moldura"></div>
            <div class="form-questao">
                <div class="form-questao-img-contraste"></div>
                <div class="form-questao-img"></div>
                <h2 id="h2_questao">Questão 1 - Qual era seu minijogo favorito?</h2>
            </div>
            <div class="form-cont-alternativas">
                <button onclick="responderAlternativa('A')" class="form-alternativa form-alternativa-superior">
                    <h2 id="questionario_alternativa_A">Cardjitsu</h2>
                </button>
                <button onclick="responderAlternativa('B')" class="form-alternativa">
                    <h2 id="questionario_alternativa_B">Catchin' Waves</h2>
                </button>
                <button onclick="responderAlternativa('C')" class="form-alternativa">
                    <h2 id="questionario_alternativa_C">Aqua Grabber</h2>
                </button>
                <button onclick="responderAlternativa('D')" class="form-alternativa form-alternativa-inferior">
                    <h2 id="questionario_alternativa_D">Pizzatron 3000</h2>
                </button>
            </div>
        </div>
    </main>
    <footer>
        <div class="rodape-redondo">
            <p>₢ Tipberg, 2026 - Todos créditos reservados.</p>
        </div>
    </footer>
</body>

</html>
