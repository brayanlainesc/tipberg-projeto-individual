<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/formulario.css">
    <script src="js/cadastro.js"></script>
</head>

<body>
    <header>
        <div class="menu-superior">
            <img id="img-logo-small" src="assets/img/icones/tipberg_logo_small.png" alt="">
            <div class="botoes">
                <a class="botao-menu" href="index.html">Início</a>
                <a class="botao-menu" href="#">Cadastre-se</a>
                <a class="botao-menu" href="login.html">Entrar</a>
                <a class="botao-menu" href="dashboard.html">
                    <button class="botao-principal">Comunidade em Números</button>
                </a>
            </div>
        </div>
    </header>
    <main>
        <div class="formulario">
            <div class="form-moldura"></div>
            <div class="form-questao">
                <div class="form-questao-img-contraste"></div>
                <div class="form-questao-img"></div>
                <h3>Cadastro de usuário</h3>
            </div>
            <div class="form-cont-campos">
                <div class="campo">
                    <label>Nome de usuário</label>
                    <div class="validacao-campo">
                        <input oninput="validarNome()" class="campo-input" type="text" id="ipt_nome">
                        <div id="msg_erro_nome"></div>
                    </div>
                </div>
                <div class="campo">
                    <label>Endereço de e-mail</label>
                    <div class="validacao-campo">
                        <input oninput="validarEmail()" class="campo-input" type="email" id="ipt_email">
                        <div id="msg_erro_email"></div>
                    </div>
                </div>
                <div class="campo-composto">
                    <div class="campo">
                        <label>Senha</label>
                        <input oninput="validarSenha()" class="campo-input" type="password" id="ipt_senha">
                    </div>
                    <div class="campo">
                        <label>Confirmação de senha</label>
                        <input oninput="validarSenha()" class="campo-input" type="password" id="ipt_conf_senha">
                    </div>
                </div>
                <div class="validacao-campo">
                    <div id="msg_erro_senha"></div>
                </div>
                <div class="campo-composto">
                    <div class="campo">
                        <label>Ano de nascimento</label>
                        <div class="validacao-campo">
                            <input oninput="validarAnoNasc()" class="campo-input" type="number" id="ipt_ano_nasc">
                            <div id="msg_erro_ano_nasc"></div>
                        </div>
                    </div>
                    <div class="campo">
                        <label>País de origem</label>
                        <div class="validacao-campo">
                            <select class="campo-input" id="sel_pais_origem">
                            </select>
                            <div id="msg_erro_pais_origem"></div>
                        </div>
                    </div>
                </div>
                <button type="button" class="botao-principal btn-login" onclick="cadastrarUsuario()">Cadastre-se</button>
                <div id="msgRetorno"></div>
            </div>
        </div>
    </main>
    <footer>
        <div class="rodape-redondo">
            <p>₢ Tipberg, 2026 - Todos créditos reservados.</p>
        </div>
    </footer>
</body>

</html>
