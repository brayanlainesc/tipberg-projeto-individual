<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/sessao.css">
    <script src="js/cadastro.js"></script>
</head>

<body>
    <header></header>
    <main>
        <img id="img_wallpaper" src="assets/img/iceberg_wallpaper.jpg" alt="">
        <div class="formulario">
            <h2>Cadastro de usuário</h2>
            <div class="campo">
                <h3>Nome de usuário</h3>
                <input type="text" id="ipt_nome">
            </div>
            <div class="campo">
                <h3>Endereço de e-mail</h3>
                <input type="email" id="ipt_email">
            </div>
            <div class="campo">
                <h3>Senha</h3>
                <input type="password" id="ipt_senha">
            </div>
            <div class="campo">
                <h3>Confirmação de senha</h3>
                <input type="password" id="ipt_conf_senha">
            </div>
            <button onclick="cadastrarUsuario()">Cadastre-se</button>
            <div id="msgRetorno"></div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
